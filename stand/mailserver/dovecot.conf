protocols = imap
listen = *
log_path = /dev/stderr

# Стенд локальный: без TLS, пароли открытым текстом
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = mailboxes
mail_gid = mailboxes
first_valid_uid = 5000

passdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
}

userdb {
  driver = static
  args = uid=mailboxes gid=mailboxes home=/var/mail/vhosts/%d/%n
}

# Через этот сокет Postfix проверяет учётные записи отправителей
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
