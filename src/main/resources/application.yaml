# Общие настройки. Всё, что зависит от стенда (адреса и учётные записи БД, почтового сервера
# и хранилища вложений), лежит в application-<стенд>.yaml; для локального запуска — профиль local.
spring:
  application:
    name: yamshchik
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  mail:
    default-encoding: UTF-8
    properties:
      mail.mime.allowutf8: true
      # Просим сервер, если он поддерживает DSN, сообщать об отказе и задержке доставки; в отчёт — только заголовки письма
      mail.smtp.dsn.notify: FAILURE,DELAY
      mail.smtp.dsn.ret: HDRS
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

yamshchik:
  dispatch:
    queue: ${DISPATCH_QUEUE:postgres}
    poll-interval: PT1S
    workers: ${DISPATCH_WORKERS:4}
    lease: PT5M
    retry:
      policy: ${RETRY_POLICY:exponential}
      max-attempts: ${RETRY_MAX_ATTEMPTS:5}
      initial-delay: ${RETRY_INITIAL_DELAY:PT30S}
      max-delay: ${RETRY_MAX_DELAY:PT1H}
  intake:
    max-message-size: 25MB
    max-recipients: 100
    max-attachments: 10
    allowed-sender-domains: ${ALLOWED_SENDER_DOMAINS:}
