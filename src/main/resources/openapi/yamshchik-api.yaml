openapi: 3.0.3
info:
  title: Yamshchik API
  version: 0.1.0
  description: >-
    API сервиса технологических email-рассылок.
    Письмо принимается на отправку асинхронно: ответ `202` означает, что письмо сохранено
    и поставлено в очередь. Результат отправки доступен по идентификатору письма.
servers:
  - url: http://localhost:8080
tags:
  - name: emails
    description: Создание и отправка писем
paths:
  /api/v1/emails:
    post:
      tags:
        - emails
      operationId: submitEmail
      summary: Принять письмо на отправку
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  $ref: '#/components/schemas/EmailRequest'
                attachments:
                  description: >-
                    Файлы вложений. Каждый файл описывается в `email.attachmentOptions` с тем же именем.
                    Файл можно не присылать, если вложение с такой же контрольной суммой сервис уже принимал.
                  type: array
                  maxItems: 100
                  items:
                    type: string
                    format: binary
            encoding:
              email:
                contentType: application/json
      responses:
        '202':
          description: Письмо принято и поставлено в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSubmission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/MissingAttachments'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
  /api/v1/emails/{emailId}:
    get:
      tags:
        - emails
      operationId: getEmail
      summary: Получить состояние письма
      parameters:
        - name: emailId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Состояние письма
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailState'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MissingAttachments:
      description: >-
        Файлы части вложений не присланы, а вложений с такими контрольными суммами у сервиса нет.
        Повторите запрос, приложив эти файлы.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/MissingAttachmentsProblem'
    ContentTooLarge:
      description: Запрос или письмо после кодирования превышает допустимый размер
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Письмо не найдено
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    EmailRequest:
      type: object
      description: >-
        Письмо. Должен быть указан хотя бы один получатель (`to`, `cc` или `bcc`)
        и хотя бы что-то из содержимого: `body.text`, `body.html` или вложение.
        Отправитель в запросе не задаётся: все письма уходят от учётной записи сервиса.
      required:
        - subject
      properties:
        replyTo:
          $ref: '#/components/schemas/Mailbox'
        to:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Mailbox'
        cc:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Mailbox'
        bcc:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Mailbox'
        personal:
          description: >-
            Персональная отправка: каждому получателю из `to` уходит отдельное письмо,
            в котором он единственный получатель. `cc` и `bcc` при этом не допускаются.
          type: boolean
          default: false
        subject:
          type: string
          maxLength: 998
          example: Отчёт готов
        body:
          $ref: '#/components/schemas/Body'
        priority:
          $ref: '#/components/schemas/Priority'
        headers:
          description: >-
            Дополнительные заголовки письма. Допустимы только имена с префиксом `X-`,
            префикс `X-Yamshchik-` зарезервирован сервисом.
          type: object
          maxProperties: 50
          additionalProperties:
            type: string
            maxLength: 998
          example:
            X-Campaign: weekly-report
        attachmentOptions:
          description: Описание каждого вложения письма, в том порядке, в каком они будут в письме.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/AttachmentOptions'
    Mailbox:
      type: object
      required:
        - address
      properties:
        address:
          type: string
          format: email
          maxLength: 254
          example: user@example.com
        name:
          description: Отображаемое имя
          type: string
          maxLength: 255
          example: Иван Иванов
    Body:
      type: object
      description: Тело письма. Если заданы оба варианта, клиент получателя выбирает сам (multipart/alternative).
      properties:
        text:
          description: Текстовый вариант (text/plain)
          type: string
        html:
          description: HTML-вариант (text/html)
          type: string
    Priority:
      type: string
      default: NORMAL
      enum:
        - LOW
        - NORMAL
        - HIGH
    AttachmentOptions:
      type: object
      required:
        - filename
        - sha256
      properties:
        filename:
          description: Имя загруженного файла, к которому относятся параметры
          type: string
          maxLength: 255
          example: logo.png
        sha256:
          description: >-
            Контрольная сумма SHA-256 содержимого файла, 64 шестнадцатеричных символа в нижнем регистре.
            Присланный файл с ней сверяется; если файл не прислан, вложение берётся из ранее принятых по этой сумме.
          type: string
          pattern: '^[0-9a-f]{64}$'
          example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        disposition:
          $ref: '#/components/schemas/AttachmentDisposition'
        contentId:
          description: Идентификатор для ссылки из HTML (`<img src="cid:...">`). Обязателен для `INLINE`.
          type: string
          maxLength: 255
          example: logo
    AttachmentDisposition:
      type: string
      default: ATTACHMENT
      enum:
        - ATTACHMENT
        - INLINE
    EmailSubmission:
      type: object
      description: Результат приёма запроса
      required:
        - emails
      properties:
        emails:
          description: >-
            Принятые письма. Одно письмо, а при персональной отправке — по одному
            на каждого получателя, в порядке списка `to`.
          type: array
          items:
            $ref: '#/components/schemas/EmailState'
    EmailState:
      type: object
      required:
        - id
        - batchId
        - status
        - attempts
        - createdAt
        - updatedAt
        - deliveries
      properties:
        id:
          type: string
          format: uuid
        batchId:
          description: Общий идентификатор писем, принятых одним запросом
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/EmailStatus'
        attempts:
          description: Сколько раз письмо бралось в отправку
          type: integer
          format: int32
        lastError:
          description: Причина последней неудачной отправки
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        nextAttemptAt:
          description: Когда будет следующая попытка. Задано только в статусе `DEFERRED`.
          type: string
          format: date-time
        deliveries:
          description: Доставка письма каждому получателю, включая копии и скрытые копии
          type: array
          items:
            $ref: '#/components/schemas/Delivery'
    Delivery:
      type: object
      required:
        - recipient
        - status
        - updatedAt
      properties:
        recipient:
          type: string
          example: user@example.com
        status:
          $ref: '#/components/schemas/DeliveryStatus'
        reportAction:
          $ref: '#/components/schemas/ReportAction'
        reportStatus:
          description: Расширенный статус из последнего отчёта о доставке (RFC 3463)
          type: string
          example: 5.1.1
        diagnostic:
          description: Ответ почтового сервера из последнего отчёта или причина отказа при отправке
          type: string
        sentAt:
          description: Когда почтовый сервер принял письмо для этого получателя
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeliveryStatus:
      type: string
      description: >-
        `PENDING` — сервер ещё не принял письмо для получателя; `SENT` — принял, отчёт о доставке не пришёл;
        `DELIVERED` — доставлено или передано дальше; `UNDELIVERED` — доставить не удалось, попыток больше не будет.
      enum:
        - PENDING
        - SENT
        - DELIVERED
        - UNDELIVERED
    ReportAction:
      type: string
      description: >-
        Действие из последнего отчёта о доставке: `DELIVERED` — доставлено в ящик; `RELAYED` — передано серверу,
        который отчётов не присылает; `EXPANDED` — доставлено и разослано дальше; `DELAYED` — сервер пока не смог
        доставить и пробует сам; `FAILED` — сервер отказался от доставки.
      enum:
        - DELIVERED
        - RELAYED
        - EXPANDED
        - DELAYED
        - FAILED
    EmailStatus:
      type: string
      description: >-
        `ACCEPTED` — принято и ждёт отправки; `SENDING` — передаётся почтовому серверу;
        `DEFERRED` — попытка не удалась, письмо ждёт следующей;
        `SENT` — почтовый сервер принял письмо, итог по получателям — в `deliveries`; `FAILED` — отправить не удалось, попыток больше не будет.
      enum:
        - ACCEPTED
        - SENDING
        - DEFERRED
        - SENT
        - FAILED
    MissingAttachmentsProblem:
      description: Описание ошибки по RFC 9457 со списком недостающих вложений
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - missingAttachments
          properties:
            missingAttachments:
              description: Контрольные суммы вложений, файлы которых нужно приложить
              type: array
              items:
                type: string
    Problem:
      type: object
      description: Описание ошибки по RFC 9457
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
          format: uri
