# Окружение для локального запуска: БД, хранилище вложений MinIO (консоль на http://localhost:9001)
# и почтовый сервер-ловушка (веб-интерфейс на http://localhost:8025)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: yamshchik
      POSTGRES_USER: yamshchik
      POSTGRES_PASSWORD: yamshchik
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yamshchik -d yamshchik"]
      interval: 2s
      timeout: 2s
      retries: 30
  minio:
    # Образы minio/minio с Docker Hub удалены; это сборка того же сервера от Chainguard.
    # Бесплатно у неё есть только тег latest, поэтому версия закреплена дайджестом (RELEASE.2026-09-22)
    image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
    # Каталог верхнего уровня в /data — это бакет: создаём его до старта сервера
    entrypoint: ["sh", "-c", "mkdir -p /data/yamshchik && exec minio server /data --console-address :9001"]
    environment:
      MINIO_ROOT_USER: yamshchik
      MINIO_ROOT_PASSWORD: yamshchik-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      # Без этого Mailpit на каждое соединение делает обратный DNS-запрос и держит приветствие ~8 секунд
      MP_SMTP_DISABLE_RDNS: "true"
      # Разрешает задавать отказы SMTP через PUT /api/v1/chaos; пока они не заданы, сервер принимает всё
      MP_ENABLE_CHAOS: "true"
    ports:
      - "1025:1025"
      - "8025:8025"
  # Kafka нужна только для хранения вложений в топике: docker compose --profile kafka up -d --wait
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT — для приложения с хоста, INTERNAL — для контейнеров
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Вложение — одно сообщение, поэтому предел размера сообщения поднят с 1 МБ до 32 МБ
      KAFKA_MESSAGE_MAX_BYTES: 33554432
      KAFKA_REPLICA_FETCH_MAX_BYTES: 33554432
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
  # Само приложение в контейнере: docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    image: yamshchik:local
    environment:
      # Профиль local, но службы доступны по именам контейнеров, а не на localhost
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/yamshchik
      SPRING_MAIL_HOST: mailpit
      YAMSHCHIK_STORAGE_S3_ENDPOINT: http://minio:9000
      YAMSHCHIK_STORAGE_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-s3}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
  kafka-data:
