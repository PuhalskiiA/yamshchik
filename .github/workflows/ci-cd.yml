name: CI/CD

on:
  # Push в любую ветку собирает образ с этой ветки
  push:
  # Ручной запуск: Actions → CI/CD → Run workflow, ветка — в списке «Use workflow from»
  workflow_dispatch:

# Новый коммит в ветку отменяет её прежний прогон
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # mvnw лежит в репозитории без бита исполнения, поэтому запускается через sh — как в Dockerfile
      - name: Сборка
        run: sh ./mvnw -B -ntp -DskipTests package

      - name: Тесты
        run: sh ./mvnw -B -ntp verify

  image:
    name: Образ
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: w8404/yamshchik
    steps:
      - uses: actions/checkout@v5

      # Теги: имя ветки (или тега) и короткий хеш коммита; latest двигает только main,
      # иначе push в рабочую ветку подменил бы образ, который забирают для развёртывания
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
