name: CI/CD

on:
  # Ручной запуск: ветку выбирают в списке «Use workflow from» на странице Actions → CI/CD → Run workflow
  workflow_dispatch:
    inputs:
      environment:
        description: Куда раскатить собранный образ
        type: choice
        options: [none, develop, production]
        default: none
  # Сам по себе пайплайн только собирает и тестирует; образ и раскатка — при ручном запуске
  push:

# Новый коммит отменяет прежний автоматический прогон; ручные запуски одной ветки идут по очереди,
# чтобы раскатка старого коммита не легла поверх нового
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # mvnw лежит в репозитории без бита исполнения, поэтому запускается через sh — как в Dockerfile
      - name: Сборка и тесты
        run: sh ./mvnw -B -ntp verify

  image:
    name: Образ
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # Учётная запись Docker Hub — переменная, а не секрет: иначе GitHub не передаст имя образа в раскатку
      IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/yamshchik
    outputs:
      ref: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      # Теги: имя выбранной ветки (или тега) и короткий хеш коммита
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Раскатка
    # Образ здесь не собирается: на стенд уходит тот, что опубликован задачей «Образ», по его дайджесту
    needs: image
    if: inputs.environment != 'none'
    runs-on: ubuntu-latest
    # Адрес стенда и ключ — переменные и секреты выбранного окружения GitHub
    environment: ${{ inputs.environment }}
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Раскатка по SSH
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::В окружении ${{ inputs.environment }} не задана переменная DEPLOY_HOST. Образ опубликован — $IMAGE"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && export YAMSHCHIK_IMAGE='$IMAGE' && docker compose pull app && docker compose up -d --wait app"
